# Publishes the demo to GitHub Pages: https://bulbi-co.github.io/doremimi-demo/
#
# Why Pages and why an Action, in a codebase whose rule is "GitHub Actions is not the release path": that rule is for
# the Bulbi services (Docker + AWS). This repo is a static demo, and its first host was Vercel, which people in Turkey
# could not open reliably (owner, 2026-11-16: "site bulunamadı", then it opened on a retry). The owner asked for
# GitHub Actions and GitHub's own domain for this repo, and only this repo.
#
# How it publishes: Pages serves the `gh-pages` branch. GitHub switched Pages on by itself when that branch was first
# pushed (2026-11-16); the "GitHub Actions" source this file was first written for needs a repository setting nobody
# could reach that night, and its two runs failed at "Setup Pages". So the job runs the guards and then
# tools/publish-pages.sh, the same script a person runs by hand: the site's files alone, committed to gh-pages.
name: Deploy the demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# contents: write, and nothing else: the job's one side effect is a commit on gh-pages.
permissions:
  contents: write

# One publish at a time; a run in progress is allowed to finish.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node, for the guards
        uses: actions/setup-node@v4
        with:
          node-version: 22
      # The guards that compare the demo with the app's own files skip here, and say so: the app repo is not checked out.
      # The files, not the folder: Node 22 reads `node --test tests/` as a module to load ("Cannot find module
      # '…/tests'") where Node 20 walked the folder. The first run of this workflow failed on exactly that.
      - name: Guards
        run: node --test tests/*.test.mjs
      - name: Publish to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash tools/publish-pages.sh

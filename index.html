<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Doremimi — Sunum</title>
  <meta name="description" content="Bulbi'nin Dore Mimi Yetenek ve Eğitim Vakfı için hazırladığı Doremimi uygulamasının tanıtım sunumu.">
  <link rel="icon" type="image/png" href="assets/brand/logo.png">
  <link rel="stylesheet" href="assets/fonts/fonts.css?v=2">
  <link rel="stylesheet" href="sunum.css?v=2">
</head>
<body>
  <div class="viewport" id="viewport">
    <div class="stage" id="stage">
      <div class="bg" id="bg"><canvas id="deck-notes" aria-hidden="true"></canvas></div>
      <div class="slides" id="slides"></div>

      <div class="topbrand"><img class="dm" src="assets/brand/logo.png" alt="Doremimi"><b>Doremimi</b><i></i><img class="bulbi" src="assets/brand/bulbi-logo.png" alt="Bulbi"></div>
      <a class="open-app" href="app/" target="_blank" rel="noopener"><span class="oa-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="2.5" width="12" height="19" rx="3"/><path d="M11 18.5h2"/></svg></span><span><b>Uygulamayı aç</b></span><svg class="oa-go" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg></a>

      <button class="open-app sound-btn" id="sound" type="button"><span class="oa-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg></span><span><b id="sound-t">Sesi aç</b><small id="sound-s">Piyano ve şarkılar</small></span></button>

      <div class="device" id="device" aria-label="Canlı uygulama">
        <span class="btn-l1"></span><span class="btn-l2"></span><span class="btn-r"></span>
        <div class="screen">
          <iframe id="phone" title="Doremimi uygulaması" src="app/?v=2&embed=1&reset=1#/"></iframe>
          <div class="island"></div>
          <div class="home-ind"></div>
        </div>
      </div>

      <div class="browser" id="browser" aria-label="İçerik paneli">
        <div class="bar"><i></i><i></i><i></i><span>Doremimi İçerik Paneli</span></div>
        <iframe id="panel" title="Doremimi İçerik Paneli" data-src="panel.html"></iframe>
      </div>

      <div class="frames" id="frames" aria-hidden="true">
        <figure class="fr phone"><img src="assets/screens/phone-kesfet-new-nav.png" alt=""></figure>
        <figure class="fr tab-p"><img src="assets/screens/tablet-kesfet-new-nav.png" alt=""></figure>
        <figure class="fr tab-l"><img src="assets/screens/12g-game-yaz-tablet-1366x1024.png" alt=""></figure>
      </div>

      <footer class="foot">
        <div class="nav">
          <button id="prev" aria-label="Önceki slayt">←</button>
          <button id="next" aria-label="Sonraki slayt">→</button>
          <span class="count" id="count">01 / 16</span>
        </div>
        <div class="dots" id="dots"></div>
        <span class="madeby">Bulbi · Doremimi tanıtım sunumu</span>
      </footer>
      <div class="progress"><b id="bar"></b></div>
    </div>
  </div>

  <aside class="notes" id="notes" hidden>
    <div class="notes-head"><strong>Konuşmacı notu</strong><span id="notes-step"></span><button id="notes-close" aria-label="Kapat">×</button></div>
    <div id="notes-body"></div>
    <small>N: notları aç/kapat · F: tam ekran · →/boşluk: sıradaki gösterim · ←: geri · R: telefonu bu slayta sıfırla</small>
  </aside>

  <script type="module" src="sunum.js?v=2"></script>
</body>
</html>

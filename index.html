<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Doremimi — Sunum</title>
  <meta name="description" content="Bulbi'nin Dore Mimi Yetenek ve Eğitim Vakfı için hazırladığı Doremimi uygulamasının tanıtım sunumu.">
  <link rel="icon" type="image/png" href="assets/brand/logo.png">
  <link rel="stylesheet" href="assets/fonts/fonts.css?v=6">
  <link rel="stylesheet" href="sunum.css?v=7">
  <link rel="stylesheet" href="deck/foundation.css?v=2">
</head>
<body>
  <div class="viewport" id="viewport">
    <div class="stage" id="stage">
      <div class="bg" id="bg"></div>
      <div class="slides" id="slides"></div>

      <div class="topbrand"><img class="dm" src="assets/brand/logo.png" alt="Doremimi"><b>Doremimi</b><i></i><img class="bulbi" src="assets/brand/bulbi-logo.png" alt="Bulbi"></div>
      <button class="open-app sound-btn" id="sound" type="button"><b id="sound-t">Sesi aç</b></button>

      <div class="device" id="device" aria-label="Canlı uygulama">
        <span class="btn-l1"></span><span class="btn-l2"></span><span class="btn-r"></span>
        <div class="screen">
          <iframe id="phone" title="Doremimi uygulaması" src="app/?v=12&embed=1&reset=1#/"></iframe>
          <div class="island"></div>
          <div class="home-ind"></div>
        </div>
      </div>

      <footer class="foot">
        <div class="nav">
          <button id="prev" aria-label="Önceki slayt">←</button>
          <button id="next" aria-label="Sonraki slayt">→</button>
          <span class="count" id="count">01 / 09</span>
          <button class="auto-btn" id="auto" type="button" aria-pressed="false" title="Otomatik oynat (A)"><span class="auto-i" aria-hidden="true"></span><b id="auto-t">Otomatik</b></button>
        </div>
        <div class="dots" id="dots"></div>
        <span class="madeby">Bulbi · Doremimi tanıtım sunumu</span>
      </footer>
      <div class="progress"><b id="bar"></b></div>
    </div>
  </div>

  <aside class="notes" id="notes" hidden>
    <div class="notes-head"><strong>Konuşmacı notu</strong><span id="notes-step"></span><button id="notes-close" aria-label="Kapat">×</button></div>
    <div id="notes-body"></div>
    <small>N: notları aç/kapat · F: tam ekran · →/boşluk: sıradaki gösterim · ←: geri · R: telefonu bu slayta sıfırla · A: otomatik oynat/durdur</small>
  </aside>

  <script type="module" src="sunum.js?v=9"></script>
</body>
</html>
